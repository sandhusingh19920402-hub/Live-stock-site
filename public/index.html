<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Stock Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body { background:#0e1117; color:#e6e6e6; font:14px sans-serif; margin:0; padding:12px; }
  .bar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  input, select, button { background:#161b22; color:#e6e6e6; border:1px solid #333; border-radius:6px; padding:8px; font-size:14px; }
  button { cursor:pointer; }
  #head { display:flex; align-items:baseline; gap:12px; margin:6px 0; }
  #name { font-size:18px; } #price { font-size:30px; font-weight:bold; }
  .up { color:#0ecb81; } .down { color:#f6465d; }
  #chart { width:100%; height:70vh; min-height:360px; }
  small { color:#7d8590; }
</style>
</head>
<body>
<div class="bar">
  <input id="sym" value="AAPL" size="6">
  <select id="tf">
    <option value="1Min">1 min</option>
    <option value="5Min">5 min</option>
    <option value="15Min">15 min</option>
  </select>
  <button onclick="start()">Load</button>
</div>
<div id="head"><span id="name">-</span><span id="price">-</span><span id="chg"></span></div>
<small id="status"></small>
<div id="chart"></div>
<small>Live data via IEX (partial market volume). Live movement only 9:30-16:00 ET, weekdays. Times in UTC.<br>
Yellow line = Buyer Power (0-100): above 50 buyers in control, above 70 very strong, below 30 very weak. Estimate only, not financial advice.</small>

<script>
const $ = id => document.getElementById(id);
let chart, candles, volume, bp, ws, cur = null, tfSec = 60, prevClose = null, sym = "", hist = [];

function makeChart() {
  if (chart) chart.remove();
  chart = LightweightCharts.createChart($("chart"), {
    layout: { background: { color: "#0e1117" }, textColor: "#9aa4b2" },
    grid: { vertLines: { color: "#1c222b" }, horzLines: { color: "#1c222b" } },
    timeScale: { timeVisible: true, secondsVisible: false },
    autoSize: true
  });
  candles = chart.addCandlestickSeries({
    upColor: "#0ecb81", downColor: "#f6465d",
    wickUpColor: "#0ecb81", wickDownColor: "#f6465d", borderVisible: false
  });
  volume = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" });
  chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.66, bottom: 0.2 } });
  chart.priceScale("right").applyOptions({ scaleMargins: { top: 0.05, bottom: 0.35 } });
  bp = chart.addLineSeries({
    color: "#f5b942", lineWidth: 2, priceScaleId: "bp",
    priceFormat: { type: "custom", formatter: v => v.toFixed(0) }
  });
  chart.priceScale("bp").applyOptions({ scaleMargins: { top: 0.82, bottom: 0.02 } });
  [30, 50, 70].forEach(lv => bp.createPriceLine({ price: lv, color: "#555", lineStyle: 2, lineWidth: 1, axisLabelVisible: false }));
}

function rsi(v, p = 14) {
  const out = Array(v.length).fill(null);
  let g = 0, l = 0;
  for (let i = 1; i < v.length; i++) {
    const d = v[i] - v[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0);
    if (i <= p) {
      g += up; l += dn;
      if (i === p) { g /= p; l /= p; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); }
    } else {
      g = (g * (p - 1) + up) / p; l = (l * (p - 1) + dn) / p;
      out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
  }
  return out;
}

    const r = b.high - b.low;

    if (rp[i] == null) continue;
